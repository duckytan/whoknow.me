<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=414,initial-scale=1"><title>04 买家↔反骨客服 多轮博弈（可交互）</title>
<link rel="stylesheet" href="shared.css"></head>
<body><div class="phone"><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="icons">●●● 5G ▱🔋</span></div>
  <div class="chatbar">
    <span class="back" onclick="history.back()">‹</span>
    <div class="c-info"><div class="cn">胡淘严选旗舰店</div><div class="cs" id="chatSub">客服 · 毒舌·王二麻（在线）</div></div>
    <span class="more">⋯</span>
  </div>
  <div class="visit-flag" id="visitFlag" hidden></div>
  <div class="chat-fav">
    <div class="fl"><span>撬动他的「破防度」</span><span><b id="affVal">50</b> / 100</span></div>
    <div class="fb"><i id="affBar" style="width:50%"></i></div>
  </div>
  <div class="chat-bg" id="chatBg"></div>
  <div class="quick">
    <div class="ql">↳ 每轮给你 4 个选项（位置随机），点一个他就会回怼：</div>
    <div class="qgrid" id="qgrid"></div>
    <div class="ql" style="margin-top:6px;color:#bbb">※ 命中他的弱点招 → 破防 +40；踩雷 → 破防 −10。推到 100 他破功，归 0 他被你劝退。</div>
  </div>
  <div class="chat-input"><span class="ic">😊</span><div class="box">说点什么…</div><span class="ic">➕</span></div>
</div></div>
<script src="npc-data.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var id = params.get('id') || 'wangerba';
  var npc = MartNPC.get(id);
  var state = { aff: 50, round: 1, visit: 1, ended: false };

  function $(s){ return document.querySelector(s); }
  function el(cls,who,txt,emoji,color){
    var m=document.createElement('div'); m.className='msg'+(cls||'');
    var av = cls===' me' ? '我' : (emoji || '😏');
    var avbg = cls===' me' ? 'linear-gradient(135deg,#FF7A00,#FF5000)' : (color || 'var(--p-du)');
    m.innerHTML='<div class="av" style="background:'+avbg+'">'+av+'</div><div class="body"><div class="who">'+who+'</div><div class="bub">'+txt+'</div></div>';
    return m;
  }
  function sys(t){
    var s=document.createElement('div'); s.className='syswrap';
    s.innerHTML='<div class="sysmsg">'+t+'</div>'; return s;
  }
  function renderAff(){
    var b=$('#affVal'), bar=$('#affBar');
    if(b) b.textContent = Math.max(0, Math.min(100, state.aff));
    if(bar) bar.style.width = Math.max(0, Math.min(100, state.aff))+'%';
  }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function firstLine(){
    return state.visit>=5
      ? npc.repeatLine.replace('{n}', state.visit)
      : npc.firstLine;
  }
  function buildOptions(){
    var keys = shuffle(Object.keys(npc.moves));
    var grid = $('#qgrid'); grid.innerHTML='';
    keys.forEach(function(k){
      var m = npc.moves[k];
      var c = document.createElement('div');
      c.className = 'qchip' + (k === npc.weakness ? ' hot' : '');
      c.innerHTML = k + '<small>' + m.say + '</small>';
      c.onclick = function(){ if(!state.ended) pick(k); };
      grid.appendChild(c);
    });
  }
  function pick(k){
    var m = npc.moves[k], bg = $('#chatBg');
    bg.appendChild(el(' me', '你 · '+k, m.say, '我', 'linear-gradient(135deg,#FF7A00,#FF5000)'));
    state.aff += m.delta;
    var d = m.delta>=0 ? ('+'+m.delta) : (''+m.delta);
    var cls = m.delta>=0 ? 'fb-float2' : 'fb-float2';
    bg.appendChild(el('', npc.name, m.reply+'<span class="'+cls+'">破防 '+d+'</span>', npc.emoji, npc.color));
    state.round++;
    bg.appendChild(sys('— 回合 '+state.round+' · 破防 '+Math.max(0, state.aff)+' —'));
    renderAff();
    bg.scrollTop = bg.scrollHeight;
    if(state.aff >= 100){ end('win'); return; }
    if(state.aff <= 0){ end('lose'); return; }
  }
  function end(result){
    state.ended = true;
    $('#qgrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#999;padding:10px 0">本局已结束</div>';
    setTimeout(function(){
      MartNPC.catchNPC(id);
      location.href = (result==='win' ? '05-chat-outcome.html' : '09-chat-outcome-lose.html') + '?id='+encodeURIComponent(id);
    }, 700);
  }
  function init(){
    $('#chatSub').textContent = npc.title;
    state.visit = MartNPC.addVisit(id);
    state.aff = 50;
    if(state.visit >= 5) state.aff = 60; // 第5单差异：磨久了起点松动
    renderAff();
    var bg = $('#chatBg');
    bg.appendChild(el('', npc.name, firstLine(), npc.emoji, npc.color));
    bg.appendChild(sys('— 回合 1 · 破防 '+state.aff+' —'));
    if(state.visit >= 5){
      var f = $('#visitFlag');
      if(f){ f.innerHTML = '🔁 第 '+state.visit+' 次进店磨他 · 他嘴角有点松了（破防起点 +10）'; f.classList.add('show'); }
    }
    buildOptions();
  }
  if(document.readyState !== 'loading') init();
  else document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body></html>
