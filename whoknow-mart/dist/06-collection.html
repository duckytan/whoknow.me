<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=414,initial-scale=1"><title>06 胡闹图鉴（反骨导购收集）</title>
<link rel="stylesheet" href="shared.css"></head>
<body><div class="phone"><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="icons">●●● 5G ▱🔋</span></div>
  <div class="navbar"><span class="back" onclick="history.back()">‹</span><span class="title">胡闹图鉴</span><span class="right">⠇</span></div>
  <div class="scroll">
    <div class="sec-title" id="collectionTitle">反骨导购 · 已收录 0 / 5 · 两种赢法皆可解锁</div>
    <div class="pcol" id="npcList">
      <!-- JS 填充 -->
    </div>
    <div class="ach">
      <div class="ah">🏆 收集成就</div>
      <div class="arow"><span class="ai">🥇</span><span class="ap">初会反骨（收录首位导购）</span><span class="ad" id="ach1">0/1</span></div>
      <div class="arow"><span class="ai">🥈</span><span class="ap">舌战群儒（对战 10 次）</span><span class="ad" id="ach2">0/10</span></div>
      <div class="arow"><span class="ai">💸</span><span class="ap">反消费达人（用归零态劝退胜 3 次）</span><span class="ad" id="ach3">0/3</span></div>
      <div class="arow"><span class="ai">🥉</span><span class="ap">全集齐（收录全部 5 位导购）</span><span class="ad" id="ach4">0/5</span></div>
      <div class="arow"><span class="ai">📸</span><span class="ap">截图收藏家（分享 5 张博弈名场面）</span><span class="ad">0/5</span></div>
      <div class="arow"><span class="ai">🎭</span><span class="ap">破防收藏家（5 位各用破防态收录）</span><span class="ad" id="ach6">0/5</span></div>
    </div>
  </div>
  <div class="tabbar">
    <div class="t" onclick="location.href='01-home.html'"><span class="bi">🏠</span>首页</div>
    <div class="t" onclick="location.href='03-cart.html'"><span class="bi">🛒</span>购物车</div>
    <div class="t on"><span class="bi">📖</span>图鉴</div>
    <div class="t" onclick="location.href='07-profile.html'"><span class="bi">👤</span>我的</div>
  </div>
</div></div>
<script src="npc-data.js"></script>
<script>
(function(){
  function render(){
    var list = $('#npcList');
    var caught = 0, totalVisits = 0;
    list.innerHTML = '';
    MartNPC.list.forEach(function(id){
      var npc = MartNPC.get(id);
      var isCaught = MartNPC.isCaught(id);
      var visits = MartNPC.visits(id);
      if(isCaught) caught++;
      totalVisits += visits;

      var card = document.createElement('div');
      card.className = 'pcard2' + (isCaught ? '' : ' locked');
      card.style.cursor = 'pointer';
      card.onclick = function(){ location.href = '04-chat.html?id=' + encodeURIComponent(id); };
      card.innerHTML =
        '<div class="pav" style="background:'+npc.color+'">'+npc.emoji+'</div>' +
        '<div class="pinfo2">' +
          '<div class="pn">'+npc.name+' <span style="font-size:11px;color:'+(isCaught?npc.color:'#bbb')+'">'+(isCaught?'已收录':'未收录')+'</span></div>' +
          '<div class="pd">'+npc.desc+'</div>' +
          '<div class="weak">⚔️ 隐藏弱点：'+npc.weakness+'</div>' +
          '<div class="motiv">🅰 反骨动机：'+npc.motive+'</div>' +
          (isCaught ? '<div class="winbadge">🏆 双重胜利：破防态 · 反消费态皆可解锁</div>' : '<div class="motiv" style="color:#999">进店 '+visits+' 次 · 点我开战</div>') +
        '</div>' +
        (isCaught ? '' : '<span class="lock">🔒</span>');
      list.appendChild(card);
    });
    $('#collectionTitle').textContent = '反骨导购 · 已收录 '+caught+' / '+MartNPC.list.length+' · 两种赢法皆可解锁';
    $('#ach1').textContent = (caught>=1?'1':'0')+'/1';
    $('#ach2').textContent = Math.min(totalVisits,10)+'/10';
    $('#ach3').textContent = '0/3'; // 反消费态次数需单独存储，后续扩展
    $('#ach4').textContent = caught+'/5';
    $('#ach6').textContent = caught+'/5';
  }
  if(document.readyState !== 'loading') render();
  else document.addEventListener('DOMContentLoaded', render);
})();
</script>
</body></html>
