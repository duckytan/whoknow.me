<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=414,initial-scale=1"><title>03 购物车 / 结算</title>
<link rel="stylesheet" href="shared.css"></head>
<body><div class="phone"><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="icons">●●● 5G ▱🔋</span></div>
  <div class="navbar"><span class="back">‹</span><span class="title">购物车</span><span class="right" style="font-size:13px;color:var(--tb)">编辑</span></div>
  <div class="scroll">
    <div class="cart-h"><span>全部商品（2）</span><span class="edit">领券中心 ›</span></div>
    <!-- 商品 1 -->
    <div class="citem">
      <div class="ck on"></div>
      <div class="ci" style="background:linear-gradient(135deg,#7ec8e3,#4a90d9)">👕</div>
      <div class="ci2">
        <div class="cit">【胡淘严选】纯棉短袖T恤 男女同款 夏季宽松</div>
        <div class="csp">颜色：雾霾蓝 · 尺码：L</div>
        <div class="crow"><span class="cpr">¥59.9</span>
          <div class="stepper"><b>−</b><i>1</i><b>+</b></div></div>
      </div>
    </div>
    <!-- 商品 2 -->
    <div class="citem">
      <div class="ck on"></div>
      <div class="ci" style="background:linear-gradient(135deg,#ffd194,#f0913a)">🍜</div>
      <div class="ci2">
        <div class="cit">深夜限定 自热小火锅 麻辣牛油 3盒装</div>
        <div class="csp">规格：微辣 · 3盒</div>
        <div class="crow"><span class="cpr">¥39.9</span>
          <div class="stepper"><b>−</b><i>2</i><b>+</b></div></div>
      </div>
    </div>
    <div class="promobanner">🎉 再买 ¥20.2 即可享受跨店满 300 减 50，当前已优惠 ¥20</div>
  </div>
  <!-- 结算栏 -->
  <div class="settlebar">
    <div class="all"><span class="ck on"></span> 全选</div>
    <div class="total">合计：<b>¥139.7</b></div>
    <button class="btn">结算(2)</button>
  </div>
</div></div></body></html>
